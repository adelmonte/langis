[package]
name = "langis-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Notification profile schedules run on the local clock.
chrono.workspace = true
# Signal's avatar colors hash the account id.
sha2 = "0.11"
sqlx.workspace = true
# SQLCipher with its crypto in Rust rather than OpenSSL: libsignal links
# BoringSSL, whose libcrypto the linker finds first and which lacks OpenSSL 3's
# EVP_CIPHER_get_* that SQLCipher calls.
libsqlite3-sys = { workspace = true, features = ["bundled-sqlcipher-custom-crypto"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Poll limits count characters as Desktop does: graphemes.
unicode-segmentation = "1"

[dev-dependencies]
tokio.workspace = true
tempfile = "3"
