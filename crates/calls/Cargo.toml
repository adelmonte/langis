[package]
name = "langis-calls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "1:1 Signal calls through RingRTC"

[dependencies]
# Signal's calling library, with Signal's prebuilt WebRTC (fetched at build
# time into OUTPUT_DIR; see .cargo/config.toml).
ringrtc = { git = "https://github.com/signalapp/ringrtc", tag = "v2.75.0", features = ["prebuilt_webrtc"] }
# Camera capture (V4L2 on Linux).
nokhwa = { version = "0.10.11", features = ["input-native", "output-threaded"] }
# Call link keys (the version RingRTC takes).
rand = { version = "0.10", features = ["sys_rng"] }
anyhow.workspace = true
tracing.workspace = true
# Screen sharing: the XDG desktop portal picks what to share and hands
# over a PipeWire stream of it (Wayland and X11 alike).
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.10"
# The portal's D-Bus calls run on a small runtime of the share's own.
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
# The portal session's Closed signal.
futures-util = "0.3"
# Scaling shared frames down to the chosen quality.
fast_image_resize = "6"
