# Screen sharing's ScreenCaptureKit bridge (macOS only) is Swift: every binary
# and test that links it needs the system's Swift runtime (in /usr/lib/swift).
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]

[env]
# Where RingRTC's build fetches Signal's prebuilt WebRTC (once, ~28 MB).
OUTPUT_DIR = { value = "target/webrtc", relative = true }
